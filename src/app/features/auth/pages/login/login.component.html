<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 to-slate-100 p-4">
  <div class="w-full max-w-md">
    <div class="login-card bg-white rounded-2xl shadow-2xl p-6 sm:p-8 border border-slate-200">

      <div class="text-center mb-6 sm:mb-8">
        <img src="/logoEfact.png" alt="EFACT" class="h-12 sm:h-16 mx-auto mb-3 sm:mb-4" />
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">Iniciar Sesión</h1>
        <p class="text-sm sm:text-base text-slate-600">Accede al visor de documentos</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4 sm:space-y-6">

        <div>
          <label for="username" class="block text-sm font-medium text-slate-700 mb-2">
            Usuario
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </div>
            <input id="username" type="text" formControlName="username" placeholder="Ingrese su usuario"
              class="block w-full pl-10 pr-3 py-2.5 sm:py-3 text-sm sm:text-base border border-slate-300 rounded-lg bg-white text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all"
              [class.border-red-500]="username?.invalid && username?.touched" />
          </div>
          <p *ngIf="username?.invalid && (username?.touched && submitted)" class="mt-1 text-xs sm:text-sm text-red-600">
            El usuario es requerido
          </p>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-2">
            Contraseña
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
            <input id="password" type="password" formControlName="password" placeholder="Ingrese su contraseña"
              class="block w-full pl-10 pr-3 py-2.5 sm:py-3 text-sm sm:text-base border border-slate-300 rounded-lg bg-white text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all"
              [class.border-red-500]="password?.invalid && password?.touched" />
          </div>
          <p *ngIf="password?.invalid && (password?.touched && submitted)" class="mt-1 text-xs sm:text-sm text-red-600">
            La contraseña es requerida
          </p>
        </div>

        <div *ngIf="errorMessage()" class="error-alert bg-red-50 border border-red-200 rounded-lg p-3 sm:p-4">
          <div class="flex items-center">
            <svg class="h-5 w-5 text-red-600 mr-2 sm:mr-3 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                clip-rule="evenodd" />
            </svg>
            <p class="text-xs sm:text-sm text-red-800">{{ errorMessage() }}</p>
          </div>
        </div>

        <button type="submit" [disabled]="loading() || loginForm.invalid"
          class="w-full flex items-center justify-center py-2.5 sm:py-3 px-4 border border-transparent rounded-lg text-white text-sm sm:text-base font-semibold bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98] cursor-pointer">
          <svg *ngIf="loading()" class="animate-spin -ml-1 mr-2 sm:mr-3 h-4 w-4 sm:h-5 sm:w-5 text-white" fill="none"
            viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          <span>{{ loading() ? 'Iniciando sesión...' : 'Iniciar Sesión' }}</span>
        </button>

      </form>

    </div>
  </div>
</div>
