<div class="xml-viewer-container">
    <div *ngIf="content" class="relative">
        <div
            class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-3 sm:mb-4 pb-2 sm:pb-3 border-b border-gray-200 gap-2">
            <h3 class="text-base sm:text-lg font-semibold text-gray-900 flex items-center">
                <svg class="h-4 w-4 sm:h-5 sm:w-5 mr-2 text-cyan-600 flex-shrink-0" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                </svg>
                <span class="text-sm sm:text-base">Archivo XML Firmado</span>
            </h3>
            <button (click)="copyToClipboard()"
                class="flex items-center justify-center space-x-1.5 sm:space-x-2 px-3 sm:px-4 py-1.5 sm:py-2 rounded-lg text-white bg-cyan-600 hover:bg-cyan-700 transition-colors cursor-pointer text-xs sm:text-sm w-full sm:w-auto">
                <svg class="h-4 w-4 sm:h-5 sm:w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                <span>{{ copied() ? '✓ Copiado' : 'Copiar XML' }}</span>
            </button>
        </div>

        <div class="code-editor-wrapper bg-gray-900 rounded-lg border border-gray-700 overflow-hidden">
            <div class="flex h-[400px] sm:h-[600px]">
                <div
                    class="line-numbers bg-gray-800 text-gray-500 text-right pr-3 pl-2 py-3 sm:py-4 select-none border-r border-gray-700 text-xs sm:text-sm font-mono overflow-hidden">
                    <div *ngFor="let line of formattedLines; let i = index" class="leading-6 h-6">
                        {{ i + 1 }}
                    </div>
                </div>

                <div class="code-content flex-1 overflow-auto">
                    <div class="p-3 sm:p-4">
                        <pre
                            class="text-xs sm:text-sm font-mono leading-6 m-0"><code class="xml-syntax" [innerHTML]="highlightedContent"></code></pre>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3 flex flex-wrap items-center gap-3 text-xs sm:text-sm text-gray-600">
            <span class="flex items-center">
                <svg class="h-4 w-4 mr-1 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                {{ formattedLines.length }} líneas
            </span>
            <span class="flex items-center">
                <svg class="h-4 w-4 mr-1 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4" />
                </svg>
                {{ content.length | number }} caracteres
            </span>
        </div>
    </div>

    <div *ngIf="!content && !loading" class="text-center py-12 sm:py-20">
        <svg class="h-12 w-12 sm:h-16 sm:w-16 text-gray-400 mx-auto mb-3 sm:mb-4" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <p class="text-sm sm:text-base text-gray-600">No hay contenido XML disponible</p>
    </div>
</div>
